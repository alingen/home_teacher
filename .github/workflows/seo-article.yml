# =============================================================
# SEO記事実装（Claude Code GitHub Actions）
# -------------------------------------------------------------
# タイトルが「[SEO記事実装]」で始まる Issue に `claude-implement` ラベルが付くと、
# Claude が CLAUDE.md の「SEO記事実装ルール」に従って記事を実装し、PR を作成します。
# merge・公開の判断は人が行います。
#
# 安全のための制限：
# - 起動できるのは、リポジトリへの書き込み権限を持つ人がラベルを付けた場合のみ
#   （claude-code-action が起動した人の権限を確認します）
# - Claude が編集できるのは記事ページと記事一覧データのみ。Web取得・パッケージ追加は不可
# - main への push はコマンドの段階で拒否。main 側のルールセット（PR必須）でも防ぐ想定
# =============================================================
name: SEO記事実装

on:
  issues:
    types: [labeled]

concurrency:
  group: seo-article-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.label.name == 'claude-implement' &&
      startsWith(github.event.issue.title, '[SEO記事実装]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-implement
          track_progress: true
          branch_prefix: seo-article/
          prompt: |
            Issue #${{ github.event.issue.number }} のSEO記事実装依頼を、CLAUDE.md の「SEO記事実装ルール」に従って実装してください。
            作業ブランチはこのワークフローが作成済みです。現在のブランチにコミットして push し、main 向けの PR を作成してください。
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit(/src/pages/articles/**),Edit(/src/data/articles.ts),Edit(//tmp/**),Bash(npm run build),Bash(npm run check:links),Bash(npm run check:article *),Bash(git status),Bash(git diff *),Bash(git log *),Bash(git add *),Bash(git commit *),Bash(git push *),Bash(gh issue view *),Bash(gh issue comment *),Bash(gh pr create *)"
            --disallowedTools "WebFetch,WebSearch,Bash(git push *main*),Bash(npm install *),Bash(npm i *),Bash(curl *),Bash(wget *)"
