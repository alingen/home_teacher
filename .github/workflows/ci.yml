# =============================================================
# CI（main 向け PR の必須チェック）
# -------------------------------------------------------------
# チェック名 `ci-build` を main のルールセットで required status check に指定しています。
# job 名を変える場合はルールセット側も合わせて変更してください。
#
# SEO 自動実装 PR（seo/issue-*）では、元 Issue の承認稿との照合（本文・リンク先・メタ情報、
# 承認後の Issue 編集の有無）も必須チェックとして行う（scripts/check-seo-pr.mjs）。
#
# 注意: このジョブには job レベルの if を付けないこと。
# スキップされたジョブは required check を「成功」扱いで満たしてしまうため、
# どのイベントでも必ず最後まで実行する。
# =============================================================
name: CI

on:
  pull_request:
    branches: [main]
    # labeled / unlabeled: seo-blocked ラベルの付け外しを merge 可否に反映するため
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read # 承認稿（元 Issue）の取得

jobs:
  build:
    name: ci-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: seo-blocked の PR は merge させない
        if: contains(github.event.pull_request.labels.*.name, 'seo-blocked')
        run: |
          echo "::error::seo-blocked ラベルが付いているため、この PR は merge できません。確認後にラベルを外すと CI が再実行されます。"
          exit 1

      - uses: actions/checkout@v7

      # Node 24 = 現在の Active LTS（Astro 5 の要件: 18.20.8 / ^20.3 / >=22）
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # astro check（型チェック）＋ astro build
      - run: npm run build

      - run: npm run check:links

      - name: 承認稿との照合（seo/issue-* の PR のみ）
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'seo/issue-')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: npm run check:seo-pr
