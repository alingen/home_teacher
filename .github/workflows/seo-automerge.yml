# =============================================================
# SEO 自動実装 PR の自動 merge
# -------------------------------------------------------------
# CI（ci-build）が成功したとき、対象が SEO 自動実装 PR なら、検証 → squash merge → merge 後の処理までを
# このジョブで順に行う。対象は次をすべて満たす PR だけ（それ以外の PR には何もしない）
#   - main 向け・このリポジトリ内のブランチ（fork 由来は対象外）で、ブランチ名が seo/issue-<番号>- で始まる
#   - 作成者が claude[bot]（seo-implement.yml の Claude GitHub App）で、draft でない
#   - CI が成功したのが PR の最新コミット
#   - PR 本文に「Closes #<番号>」があり、その Issue が [SEO記事実装] ＋ seo-approved で open、seo-blocked なし
#   - seo-approved の付与後に Issue 本文が編集されていない
#   - PR に seo-blocked がない
#   - 変更ファイルが記事ページ（src/pages/articles/*.astro）と src/data/articles.ts の追加・変更だけで、
#     種別と合っている（新規記事＝記事ページ1件の追加、リライト＝既存記事ページの変更）
# 承認稿との本文・リンク先・メタ情報の照合は CI（ci-build）の必須チェックで行う（scripts/check-seo-pr.mjs）。
# merge 時の required check（ci-build）・conflict の判定は main のルールセットにより GitHub が強制する。
# 条件を満たさない場合は seo-blocked を付けて停止する。
#
# GitHub 標準の auto-merge を使わない理由:
#   auto-merge を GITHUB_TOKEN で有効化すると merge も github-actions の操作になり、
#   Closes による Issue の自動 close・ブランチ自動削除・merge 後のワークフローが動かない（動作確認で判明）。
#   そのため merge 後の処理（Issue close・結果コメント・ブランチ削除）もこのジョブで明示的に行う。
# =============================================================
name: SEO自動merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: seo-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'seo/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const branch = run.head_branch;
            const issueNumber = Number(branch.match(/^seo\/issue-(\d+)-/)?.[1]);

            const { data: prs } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, base: 'main', state: 'open' });
            const pr = prs[0];
            if (!pr) return core.notice('対象の open PR がありません（merge 済みなど）');
            if (pr.user.login !== 'claude[bot]') return core.notice('SEO 自動実装 PR ではないため何もしません');
            if (pr.draft) return core.notice('draft のため merge しません');
            if (pr.head.sha !== run.head_sha) return core.notice('CI が成功したのは最新のコミットではないため、最新コミットの CI を待ちます');

            const block = async (reason) => {
              for (const n of [pr.number, issueNumber].filter(Boolean)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['seo-blocked'] }).catch(() => {});
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `⚠️ 自動 merge の条件を満たさないため \`seo-blocked\` を付けて停止しました。\n\n- ${reason}\n\n確認後、問題なければ \`seo-blocked\` を外して手動で squash merge してください。`,
              });
              core.setFailed(reason);
            };

            if (!issueNumber) return block('ブランチ名から Issue 番号を読み取れません');

            const closesRe = new RegExp(`(^|\\s)(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#${issueNumber}(?!\\d)`, 'i');
            if (!closesRe.test(pr.body ?? '')) return block(`PR 本文に「Closes #${issueNumber}」がありません`);

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const issueLabels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
            if (issue.pull_request) return block(`#${issueNumber} は Issue ではありません`);
            if (!issue.title.startsWith('[SEO記事実装]')) return block(`#${issueNumber} のタイトルが [SEO記事実装] で始まっていません`);
            if (!issueLabels.includes('seo-approved')) return block(`#${issueNumber} に seo-approved がありません`);
            if (issueLabels.includes('seo-blocked')) return block(`#${issueNumber} に seo-blocked が付いています`);
            if (issue.state !== 'open') return block(`#${issueNumber} が open ではありません`);

            if (pr.labels.some((l) => l.name === 'seo-blocked')) return block('PR に seo-blocked が付いています');

            // 承認後に Issue 本文が編集されていないこと（CI 成功から merge までの間の改変も防ぐ）
            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    lastEditedAt
                    timelineItems(itemTypes: [LABELED_EVENT], last: 100) {
                      nodes { ... on LabeledEvent { createdAt label { name } } }
                    }
                  }
                }
              }`,
              { owner, repo, number: issueNumber },
            );
            const approvedAt = repository.issue.timelineItems.nodes
              .filter((n) => n.label?.name === 'seo-approved').map((n) => n.createdAt).sort().at(-1);
            if (!approvedAt) return block(`#${issueNumber} で seo-approved を付けた記録が見つかりません`);
            if (repository.issue.lastEditedAt && repository.issue.lastEditedAt > approvedAt) {
              return block(`#${issueNumber} の本文が seo-approved の付与後に編集されています。内容を確認し、seo-approved を付け直してください`);
            }

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const allowed = (f) =>
              ['added', 'modified'].includes(f.status) &&
              (/^src\/pages\/articles\/[a-z0-9-]+\.astro$/.test(f.filename) || f.filename === 'src/data/articles.ts');
            const outside = files.filter((f) => !allowed(f));
            if (files.length === 0) return block('変更ファイルがありません');
            if (outside.length > 0) {
              return block(`記事ファイル以外の変更があります: ${outside.map((f) => `${f.filename}（${f.status}）`).join(', ')}`);
            }

            // 種別と変更内容が合っていること（新規記事＝記事ページ1件の追加、リライト＝記事ページの変更）
            const kind = (issue.body ?? '').match(/^#{2,3} +種別\s*\n+\s*(\S+)/m)?.[1];
            const pages = files.filter((f) => f.filename.startsWith('src/pages/articles/'));
            if (kind === '新規記事' && !(pages.length === 1 && pages[0].status === 'added')) {
              return block('種別は「新規記事」ですが、記事ページ1件の追加になっていません');
            }
            if (kind === 'リライト' && !(pages.length >= 1 && pages.every((f) => f.status === 'modified'))) {
              return block('種別は「リライト」ですが、既存の記事ページの変更になっていません');
            }
            if (kind !== '新規記事' && kind !== 'リライト') return block(`#${issueNumber} の種別を読み取れません（${kind ?? 'なし'}）`);

            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['seo-automation'] });

            // squash merge（sha を指定し、CI が成功したコミットから変わっていないことを保証する）
            let merged;
            try {
              ({ data: merged } = await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, merge_method: 'squash', sha: run.head_sha,
              }));
            } catch (error) {
              return block(`merge できませんでした（${error.status}: ${error.message}）。conflict やルールセットの条件を確認してください`);
            }
            core.info(`PR #${pr.number} を squash merge しました: ${merged.sha}`);

            // merge 後の処理: 結果コメント → seo-in-progress を外す → Issue を close → ブランチ削除
            const articleUrls = files
              .map((f) => f.filename.match(/^src\/pages\/articles\/([a-z0-9-]+)\.astro$/)?.[1])
              .filter(Boolean)
              .map((slug) => `/articles/${slug}`);
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: [
                `✅ PR #${pr.number} を main に squash merge しました（required check \`ci-build\` 成功後の自動 merge）。`,
                '',
                `- 記事: ${articleUrls.join(', ')}`,
                `- merge コミット: ${merged.sha}`,
                `- CI: ${run.html_url}`,
              ].join('\n'),
            });
            await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'seo-in-progress' }).catch(() => {});
            await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'completed' });
            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` }).catch((e) => core.warning(`ブランチ削除に失敗: ${e.message}`));
