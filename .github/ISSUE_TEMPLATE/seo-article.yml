# SEO記事実装 Issue のフォーム。
# Dots が API で Issue を作る場合も、このフォームが生成するのと同じ本文（### 見出し＋各欄）にしてください。
# 形式の説明とコピー用の本文テンプレートは docs/seo-automation.md にあります。
# 欄名を変える場合は scripts/check-article-text.mjs の FORM_LABELS も合わせて変更してください。
name: SEO記事実装
description: 承認済みの記事・リライト原稿を Claude Code が実装し、CI 成功後に自動 merge します
title: "[SEO記事実装] "
body:
  - type: markdown
    attributes:
      value: |
        **承認済みの原稿だけを登録してください。** `seo-approved` ラベルを付けると Claude Code が実装を開始し、CI 成功後に自動で main へ merge（公開）されます。
        実装は承認稿（この Issue）と本文・リンク先・メタ情報まで照合されます。`seo-approved` を付けた後に本文を編集すると CI が失敗するので、直したときは `seo-approved` を付け直してください。
        このリポジトリは公開されているため、Issue の内容は誰でも閲覧できます。

  - type: dropdown
    id: kind
    attributes:
      label: 種別
      options:
        - 新規記事
        - リライト
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: 対象URL・slug
      description: 半角英小文字・数字・ハイフン。URL は /articles/<slug> になります
      placeholder: /articles/junior-high-english-reading-word-order
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: title
      description: SEOタイトル（<title>）。リライトで変更しない場合は「変更なし」
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: meta description
      description: リライトで変更しない場合は「変更なし」
    validations:
      required: true

  - type: input
    id: h1
    attributes:
      label: H1
      description: ページ上部の見出し。リライトで変更しない場合は「変更なし」
    validations:
      required: true

  - type: input
    id: publish_date
    attributes:
      label: 公開日
      description: YYYY-MM-DD。新規記事は必須。リライトは「変更なし」
      placeholder: "2026-10-11"
    validations:
      required: true

  - type: input
    id: excerpt
    attributes:
      label: 記事一覧の紹介文
      description: トップの「お役立ち記事」カードの紹介文（50〜60字程度）。リライトで変更しない場合は「変更なし」
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: この記事を作る理由

  - type: textarea
    id: intent
    attributes:
      label: 検索意図

  - type: textarea
    id: outline
    attributes:
      label: H2 / H3構成
      description: 完成原稿の見出し一覧（確認用）

  - type: textarea
    id: draft
    attributes:
      label: 完成原稿
      description: H1 は含めず、本文を Markdown で記入（## が H2、### が H3）。リライトは差し替え後の本文全体
      render: markdown
    validations:
      required: true

  - type: textarea
    id: internal_links
    attributes:
      label: 内部リンク
      description: 完成原稿の外に置くリンク。「置き場所：リンク文言 → リンク先」を1行ずつ（リンク先も照合されます）。なければ「なし」。リライトでも「変更なし」は使わず、ページに置くリンクをすべて書く
      placeholder: |
        記事末尾：福岡の家庭教師の料金について読む → /articles/home-teacher-fees-fukuoka

  - type: textarea
    id: cta
    attributes:
      label: CTA
      description: 記事末尾に置くリンク。「置き場所：リンク文言 → リンク先」を1行ずつ（リンク先も照合されます）。なければ「なし」。記事下の共通LINEボタンは変更しません
      placeholder: |
        現在の募集状況・指導内容を確認する → /

  - type: textarea
    id: notes
    attributes:
      label: 実装上の注意
